[project]
name = "d2draft-mvp"
version = "0.2.0"
description = "Phase-aware Dota 2 ranked draft research MVP"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "Pillow>=10.0"]

[project.optional-dependencies]
build = ["PyInstaller>=6.0"]

[tool.setuptools]
packages = ["d2draft"]
py-modules = ["dota2_bp_helper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
